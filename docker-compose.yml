version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: microhubs
      POSTGRES_USER: microhubs
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/microhubs
      SPRING_DATASOURCE_USERNAME: microhubs
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET:default-secret-change-in-production}
      LLM_API_KEY: ${LLM_API_KEY:}
    depends_on:
      - db

volumes:
  pgdata:
