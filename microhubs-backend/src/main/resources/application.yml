spring:
  application:
    name: microhubs-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:microhubs}?stringtype=unspecified
    username: ${SPRING_DATASOURCE_USERNAME:microhubs}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET:default-secret-change-in-production}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

llm:
  api:
    key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
  model: ${LLM_MODEL:openai/gpt-oss-20b}
