spring:
  application:
    name: microhubs-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:microhubs}?stringtype=unspecified
    username: ${SPRING_DATASOURCE_USERNAME:microhubs}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

server:
  port: ${PORT:8082}
address: 0.0.0.0

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

llm:
  api:
    key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
  model: ${LLM_MODEL:openai/gpt-oss-20b}

# Public Stack Overflow search (Stack Exchange API). Works anonymously; the
# optional key only raises the daily request quota and stays server-side.
stackoverflow:
  base-url: ${STACKOVERFLOW_BASE_URL:https://api.stackexchange.com/2.3}
  site: ${STACKOVERFLOW_SITE:stackoverflow}
  key: ${STACKOVERFLOW_KEY:}

# Stack Overflow for Agents (SOFA). Dormant until an API key is set — the
# provider reports "not configured" and is never called without it.
sofa:
  base-url: ${SOFA_BASE_URL:https://agents.stackoverflow.com}
  api-key: ${SOFA_API_KEY:}
  client-name: ${SOFA_CLIENT_NAME:venster-backend}
  model-name: ${SOFA_MODEL_NAME:unknown}
